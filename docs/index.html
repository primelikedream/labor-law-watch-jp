<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>労働法制ウォッチ — 日本の労働関連法制の変更・トピック</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="site-header">
  <h1>労働法制ウォッチ</h1>
  <p class="subtitle">日本の労働関連法制の変更・トピックを時系列でサマリー</p>
  <p class="updated-at" id="updatedAt"></p>
</header>

<main>
  <div class="controls">
    <input id="searchBox" type="search" placeholder="キーワードで検索 (例: 育児休業, 最低賃金)" />
    <div class="filter-group" id="sourceFilter">
      <label><input type="checkbox" value="mhlw_news" checked /> 厚労省 新着情報</label>
      <label><input type="checkbox" value="egov_law_update" checked /> 法令改正 (e-Gov)</label>
    </div>
  </div>

  <p class="count" id="itemCount"></p>
  <div id="timeline" class="timeline"></div>
  <p id="emptyState" class="empty-state" hidden>該当するトピックがありません。</p>
</main>

<footer class="site-footer">
  <p>情報源: <a href="https://www.mhlw.go.jp/stf/news.rdf" target="_blank" rel="noopener">厚生労働省 新着情報RSS</a> /
     <a href="https://laws.e-gov.go.jp/" target="_blank" rel="noopener">e-Gov 法令API</a>。
     要約はAIにより自動生成されており、正確性を保証するものではありません。詳細は必ずリンク先の一次情報をご確認ください。</p>
</footer>

<script src="app.js"></script>
</body>
</html>
